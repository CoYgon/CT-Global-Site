<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>gatekeeper-sandbox</title>
    <!--
      Bu sayfanın KENDİ CSP'si var — ana sitenin script-src 'self' politikasını
      MİRAS ALMIYOR, çünkü srcdoc/blob/data değil, gerçek bir URL üzerinden
      (iframe.src = "/sandbox.html") yükleniyor. Spec'e göre CSP inheritance
      sadece about:srcdoc / about:blank / blob: / data: dokümanları için
      geçerli — normal bir HTTP kaynağı kendi politikasını kendi belirler.

      Bu sayede ana sayfa hiç 'unsafe-eval' / 'unsafe-inline' içermeden kalıyor,
      sadece BU izole (ve sandbox="allow-scripts" ile same-origin'i olmayan)
      dosya kullanıcı kodunu çalıştırmak için gereken izinlere sahip.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval';"
    />
  </head>
  <body>
    <script>
      // Bu dosya SADECE Gatekeeper sınavındaki kullanıcı kodunu çalıştırmak
      // için var. Parent tarafından "sandbox" attribute'ünde allow-same-origin
      // OLMADAN embed edildiği için bu doküman opak (unique) bir origin'de
      // yaşıyor — parent'ın cookie'sine, localStorage'ına, DOM'una erişemez.
      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || data.__gatekeeperRun !== true) return;

        try {
          // eslint-disable-next-line no-new-func
          var factory = new Function(data.code + "\nreturn run();");
          var value = factory();
          event.source.postMessage(
            { __gatekeeperResult: true, ok: true, value: String(value) },
            "*"
          );
        } catch (err) {
          event.source.postMessage(
            {
              __gatekeeperResult: true,
              ok: false,
              error: err && err.message ? err.message : String(err),
            },
            "*"
          );
        }
      });
    </script>
  </body>
</html>
